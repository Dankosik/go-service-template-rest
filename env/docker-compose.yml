services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      # initdb fsyncs a cluster this container recreates on every `down -v`, and
      # that sync is most of the startup a caller waits on. It bounds nothing
      # after initialization: the running server keeps its default durability.
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 3s
      retries: 20

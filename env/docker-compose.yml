services:
  postgres:
    image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      # initdb fsyncs a cluster this container recreates on every `down -v`, and
      # that sync is most of the startup a caller waits on. It bounds nothing
      # after initialization: the running server keeps its default durability.
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 3s
      retries: 20

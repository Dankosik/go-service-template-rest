services:
  postgres:
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      # initdb fsyncs a cluster this container recreates on every `down -v`, and
      # that sync is most of the startup a caller waits on. It bounds nothing
      # after initialization: the running server keeps its default durability.
      POSTGRES_INITDB_ARGS: --no-sync
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 30s
      start_interval: 1s
      start_period: 30s
      timeout: 3s
      retries: 20

app:
  env: local

http:
  addr: ":8080"

# profile:authn-oidc-jwt:start
# Replace these with a real local HTTPS issuer and API audience. The reserved
# example host intentionally cannot provide production trust.
authn:
# profile:jobs-postgres:start
# The source template keeps the jobs worker inactive. A selected service enables
# it with one conservative worker and raises the value only from capacity proof.
jobs:
  max_workers: 0
# profile:jobs-postgres:end
  issuer: "https://issuer.example.com"
  audience: "https://api.example.com"
  token_profile: "resource-server"
# profile:authn-oidc-jwt:end

# profile:http-idempotency-postgres:start
# This optional pack stays inactive until an adopting operation is registered.
# The retry window is deployment-owned and intentionally invalid here.
http_idempotency:
  retention: 0s
# profile:http-idempotency-postgres:end

# profile:outbound-auth-oauth2-client-credentials:start
# OAuth client credentials are environment-only. Keep this non-secret shape
# empty until deployment supplies one complete fixed dependency.
outbound_auth:
  token_url: ""
  client_id: ""
  client_secret: ""
  scopes: ""
  audience: ""
  resource: ""
# profile:outbound-auth-oauth2-client-credentials:end

log:
  level: debug

# profile:object-storage:start
# The selected profile is fail-closed until deployment supplies this complete
# immutable tuple through APP__OBJECT_STORAGE__* environment variables.
object_storage:
  provider: ""
  endpoint: ""
  region: ""
  bucket: ""
  expected_bucket_owner: ""
  credential_source: ""
  max_object_bytes: 0
# profile:object-storage:end

# profile:database-postgres:start
postgres:
  enabled: true
# profile:database-postgres:end

# profile:webhooks-durable:start
# Deployment supplies receiver metadata and the jobs worker receives signing
# secrets through APP__WEBHOOKS__STATIC_SECRETS only.
webhooks:
  enabled: false
  endpoints: ""
  static_secrets: ""
# profile:webhooks-durable:end

# profile:inbound-webhooks-standard:start
# Deployment supplies endpoint IDs here. Verification secrets stay in
# APP__INBOUND_WEBHOOKS__STATIC_SECRETS on the service process only.
inbound_webhooks:
  endpoints: ""
  static_secrets: ""
# profile:inbound-webhooks-standard:end

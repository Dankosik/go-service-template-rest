app:
  env: local
  version: dev

http:
  addr: ":8080"
  shutdown_timeout: 30s
  readiness_timeout: 4s
  readiness_propagation_delay: 15s
  read_header_timeout: 5s
  read_timeout: 5s
  write_timeout: 10s
  idle_timeout: 60s
  max_header_bytes: 16384
  max_body_bytes: 1048576

log:
  level: info

postgres:
  enabled: false
  dsn: ""
  connect_timeout: 3s
  healthcheck_timeout: 3s
  max_open_conns: 25
  conn_max_lifetime: 30m

observability:
  otel:
    service_name: service
    traces_sampler: parentbased_traceidratio
    traces_sampler_arg: 0.10
    exporter:
      otlp_endpoint: ""
      otlp_traces_endpoint: ""
      otlp_headers: ""
      otlp_protocol: http/protobuf

feature_flags:
  postgres_readiness_probe: true

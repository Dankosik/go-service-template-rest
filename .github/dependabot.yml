version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Development tools reach every generated service but ship in none of them, and
  # CI proves they still work. Monthly keeps the upgrade stream proportional to
  # what a tool bump actually risks.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "tools"
    groups:
      go-tools:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/build/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    groups:
      docker-images:
        patterns:
          - "*"

  # profile:database-postgres:start
  - package-ecosystem: "docker-compose"
    directory: "/env"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    groups:
      docker-compose:
        patterns:
          - "*"
  # profile:database-postgres:end

name: nightly

on:
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  FUZZ_TIME: 60s

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Flake detection run
        run: make test-flake-smoke

      - name: Fuzz smoke run
        run: make test-fuzz-smoke FUZZ_TIME=${{ env.FUZZ_TIME }}

      - name: Integration tests
        run: REQUIRE_DOCKER=1 make test-integration

      - name: Benchmark infrastructure check
        run: make benchmark-infra-check

      - name: Run Go security checks
        run: make go-security

      - name: Build container image
        run: make runtime-image-build RUNTIME_IMAGE=service:nightly

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: service:nightly
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

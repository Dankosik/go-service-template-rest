name: integration

on:
  push:
    branches: [main]
    paths:
      - build/docker/Dockerfile
      - cmd/migrate/**
      - cmd/jobs-worker/**
      - cmd/outbox-relay/**
      - env/docker-compose.yml
      - go.mod
      - go.sum
      - internal/infra/postgres*/**
      - migrations/**
      - scripts/ci/runtime-image-build.sh
      - scripts/init-module.sh
      - test/**
  pull_request:
    branches: [main]
    paths:
      - build/docker/Dockerfile
      - cmd/migrate/**
      - cmd/jobs-worker/**
      - cmd/outbox-relay/**
      - env/docker-compose.yml
      - go.mod
      - go.sum
      - internal/infra/postgres*/**
      - migrations/**
      - scripts/ci/runtime-image-build.sh
      - scripts/init-module.sh
      - test/**
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2

jobs:
  postgres-image:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Real PostgreSQL integration
        run: REQUIRE_DOCKER=1 make test-integration
      - name: Production image
        env:
          APP_VERSION: sha-${{ github.sha }}
          VCS_REF: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: make runtime-image-build RUNTIME_IMAGE=service:ci
      - name: Migration and runtime rehearsal
        run: make migration-validate RUNTIME_IMAGE=service:ci RUNTIME_EXPECTED_VERSION="sha-${GITHUB_SHA}"
      - name: Image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: service:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

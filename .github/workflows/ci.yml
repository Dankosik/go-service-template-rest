name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOLANGCI_LINT_VERSION: v2.10.1
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  COVERAGE_MIN: "80.0"

jobs:
  repo-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module integrity
        run: make mod-check

      - name: Verify required repository guardrails
        run: make guardrails-check

      - name: Verify workflow instructions
        run: make workflow-routing-check

      - name: Verify formatting drift
        run: make fmt-check

      - name: Verify sqlc generation drift
        run: make sqlc-check

      - name: Verify docs drift policy
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE_REF="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              BASE_REF="${{ github.event.before }}"
              ;;
            *)
              echo "event does not provide stable base ref, skipping docs drift check"
              exit 0
              ;;
          esac

          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "base ref is unavailable, skipping docs drift check"
            exit 0
          fi

          make docs-drift-check BASE_REF="${BASE_REF}" HEAD_REF="${{ github.sha }}"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Verify golangci-lint config (15s schema timeout)
        run: |
          SCHEMA_VERSION="$(echo "${GOLANGCI_LINT_VERSION#v}" | cut -d. -f1,2)"
          SCHEMA_URL="https://golangci-lint.run/jsonschema/golangci.v${SCHEMA_VERSION}.jsonschema.json"
          SCHEMA_FILE="$(mktemp)"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 15 \
            "${SCHEMA_URL}" \
            --output "${SCHEMA_FILE}"

          golangci-lint config verify --schema "${SCHEMA_FILE}"

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          verify: false
          args: --timeout=3m

  openapi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.20.0"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate OpenAPI Go bindings
        run: make openapi-generate

      - name: Detect OpenAPI codegen drift
        run: make openapi-drift-check

      - name: Compile generated OpenAPI package
        run: go test ./internal/api

      - name: Verify OpenAPI runtime contract
        run: make openapi-runtime-contract-check

      - name: Validate OpenAPI schema
        run: make openapi-validate

      - name: Lint OpenAPI rules
        run: make openapi-lint

  openapi-breaking:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - repo-integrity
      - openapi-contract
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Extract base OpenAPI spec
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if git show "${BASE_SHA}:api/openapi/service.yaml" > /tmp/openapi-base.yaml 2>/dev/null; then
            echo "BASE_SPEC_FOUND=true" >> "$GITHUB_ENV"
          else
            echo "BASE_SPEC_FOUND=false" >> "$GITHUB_ENV"
            echo "No base OpenAPI spec found in base commit. Skipping breaking-change check."
          fi

      - name: Check OpenAPI breaking changes
        if: env.BASE_SPEC_FOUND == 'true'
        run: BASE_OPENAPI=/tmp/openapi-base.yaml make openapi-breaking

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: make test

      - name: Go vet
        run: make vet

  test-race:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Race detector
        run: make test-race

  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Coverage + JUnit + JSON
        run: make test-report COVERAGE_MIN=${{ env.COVERAGE_MIN }}

      - name: Write test coverage summary
        if: always()
        run: |
          {
            echo "## Test coverage"
            echo
            if [ -f coverage.out ]; then
              coverage_details="$(go tool cover -func=coverage.out 2>&1 || true)"
              coverage_total="$(printf '%s\n' "${coverage_details}" | awk '/^total:/ {print $3}')"
              echo "- Total coverage: ${coverage_total:-unavailable}"
              echo "- Required minimum: ${COVERAGE_MIN}%"
              echo
              echo "<details><summary>Coverage details</summary>"
              echo
              echo '```text'
              printf '%s\n' "${coverage_details}"
              echo '```'
              echo
              echo "</details>"
            else
              echo "- coverage.out was not produced."
            fi

            echo
            echo "## Test report"
            echo
            if [ -f .artifacts/test/test2json.json ]; then
              awk '
                /"Test":/ && /"Action":"pass"/ { passed++ }
                /"Test":/ && /"Action":"fail"/ { failed++ }
                /"Test":/ && /"Action":"skip"/ { skipped++ }
                END {
                  printf "- Test events: %d passed, %d failed, %d skipped\n", passed + 0, failed + 0, skipped + 0
                }
              ' .artifacts/test/test2json.json
            else
              echo "- test2json report was not produced."
            fi
            echo "- JUnit artifact: .artifacts/test/junit.xml"
            echo "- test2json artifact: .artifacts/test/test2json.json"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.out
          if-no-files-found: error

      - name: Upload test report artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-artifacts
          path: |
            .artifacts/test/junit.xml
            .artifacts/test/test2json.json
          if-no-files-found: error

  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests
        run: REQUIRE_DOCKER=1 make test-integration

  migration-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repo-integrity
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect migration changes
        id: migration_changes
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              BASE_REF="${{ github.event.pull_request.base.sha }}"
              ;;
            push)
              BASE_REF="${{ github.event.before }}"
              ;;
            *)
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          if [ -z "${BASE_REF}" ] || [ "${BASE_REF}" = "0000000000000000000000000000000000000000" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${BASE_REF}" "${{ github.sha }}" | grep -Eq '^env/migrations/'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.migration_changes.outputs.should_run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate migrations on ephemeral Postgres
        if: steps.migration_changes.outputs.should_run == 'true'
        run: |
          make migration-validate \
            MIGRATION_DSN='postgres://app:app@localhost:5432/app?sslmode=disable'

      - name: Skip migration validation
        if: steps.migration_changes.outputs.should_run != 'true'
        run: echo "no migration files changed"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: repo-integrity
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review (informational)
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          warn-only: true
          comment-summary-in-pr: never

  go-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: make govulncheck

      - name: Run gosec
        run: make gosec

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gitleaks
        run: make secret-scan

  container-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: repo-integrity
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build container image
        run: docker build -f build/docker/Dockerfile -t service:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: service:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

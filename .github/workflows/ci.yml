name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Detect changed surfaces
        id: surfaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          template=false
          agents=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            files="$(git diff --name-only "${BASE_SHA}" HEAD)"
          elif [ "${{ github.event_name }}" = push ] && [ -n "${BASE_SHA}" ] && [ "${BASE_SHA}" != 0000000000000000000000000000000000000000 ]; then
            files="$(git diff --name-only "${BASE_SHA}" HEAD)"
          else
            files="$(git ls-files)"
          fi
          if printf '%s\n' "${files}" | grep -Eq '^(scripts/init-module\.sh|scripts/ci/init-module-contract-check\.sh|scripts/ci/template-init-check\.sh|scripts/profiles/|Makefile$|template-owned\.paths$|template\.lock$)'; then
            template=true
          fi
          if printf '%s\n' "${files}" | grep -Eq '^(AGENTS\.md|CLAUDE\.md|Grok\.md|QWEN\.md|evals/|\.agents/|\.claude/|\.codex/|\.cursor/|\.grok/|\.opencode/|\.qwen/|docs/agent-harness|docs/spec-first-workflow|docs/prompt-|docs/skill-authoring|docs/validation|scripts/agent-roles-sync\.sh|scripts/harness-skills-sync\.sh|scripts/codex-agents-sync\.sh|scripts/template-sync\.sh|scripts/ci/instruction-evals-check\.sh|scripts/ci/template-owned-purity-check\.sh)'; then
            agents=true
          fi
          echo "template=${template}" >>"${GITHUB_OUTPUT}"
          echo "agents=${agents}" >>"${GITHUB_OUTPUT}"
      - name: Go quality
        run: make check
      - name: Initializer contract
        if: github.event_name != 'pull_request' || steps.surfaces.outputs.template == 'true'
        run: make template-init-check
      - name: Instruction ownership
        if: github.event_name != 'pull_request' || steps.surfaces.outputs.agents == 'true'
        run: |
          make agent-roles-check codex-agents-check claude-skills-check qwen-skills-check template-owned-purity-check
          make instruction-evals-check
      - name: Breaking contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git show "${BASE_SHA}:api/openapi/service.yaml" >/tmp/openapi-base.yaml 2>/dev/null; then
            make openapi-breaking BASE_OPENAPI=/tmp/openapi-base.yaml
          fi
          make proto-breaking BASE_REF="${BASE_SHA}"

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Go security
        run: make govulncheck gosec
      - name: Secret scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            make secret-scan BASE_REF="${BASE_SHA}"
          else
            make secret-scan-history
          fi

  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Workflows
        run: make actionlint
      - name: Shell
        run: make shellcheck
      - name: Dockerfile
        run: make dockerfile-check

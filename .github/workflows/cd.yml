name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  COVERAGE_MIN: "80.0"
  COSIGN_VERSION: v2.6.2

jobs:
  publish-main:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA:0:12}"

          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag_main=main" >> "$GITHUB_OUTPUT"
          echo "tag_sha=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "primary_image=${IMAGE_REPO}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=sbom-main-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f build/docker/Dockerfile \
            -t "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_sha }}" \
            .

      # profile:database-postgres:start
      - name: Validate migrations and runtime image
        run: |
          make migration-validate \
            RUNTIME_IMAGE="${{ steps.meta.outputs.primary_image }}" \
            RUNTIME_EXPECTED_VERSION="${{ steps.meta.outputs.version }}"
      # profile:database-postgres:end

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Push immutable image tag
        run: |
          docker push "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_sha }}"

      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST="$(docker image inspect "${{ steps.meta.outputs.primary_image }}" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign container image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify release trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@refs/heads/${{ github.event.repository.default_branch }}"

          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"
          gh attestation verify "oci://${IMAGE}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type "https://cyclonedx.org/bom"

      - name: Promote verified main tag
        run: |
          docker tag \
            "${{ steps.meta.outputs.primary_image }}" \
            "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_main }}"
          docker push "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_main }}"
          test "$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_main }}"
          )" = "${{ steps.digest.outputs.digest }}"

      - name: Publish immutable image reference
        run: |
          {
            echo "### Published image"
            echo
            printf '`%s`\n' "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: sbom.cdx.json
          if-no-files-found: error

  release-preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Resolve golangci-lint version
        id: golangci_lint
        run: |
          VERSION="$(awk '$1 == "github.com/golangci/golangci-lint/v2" { print $2 }' tools/go.mod)"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@e7fa5ac41e1cf5b7d48e45e42232ce7ada589601 # v9.1.0
        with:
          version: ${{ steps.golangci_lint.outputs.version }}
          install-only: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Verify module integrity
        run: make mod-check

      - name: Verify template initialization contract
        run: make template-init-check GOLANGCI_LINT_BIN=golangci-lint

      - name: Verify formatting drift
        run: make fmt-check

      # profile:database-postgres:start
      - name: Verify sqlc generation drift
        run: make sqlc-check
      # profile:database-postgres:end

      - name: Verify project structure
        run: make project-structure-check

      - name: Lint
        run: make lint GOLANGCI_LINT=golangci-lint

      - name: Coverage + JUnit + JSON
        run: make test-report COVERAGE_MIN=${{ env.COVERAGE_MIN }}

      - name: Race detector
        run: make test-race

      - name: Integration tests
        run: REQUIRE_DOCKER=1 make test-integration

      - name: OpenAPI contract checks
        run: make openapi-check

      - name: Run Go security checks
        run: make go-security

      - name: Secret scan
        run: make secret-scan-history

  publish-release:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release-preflight
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION_TAG="${GITHUB_REF_NAME}"

          echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"
          echo "tag_version=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=latest" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "primary_image=${IMAGE_REPO}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=sbom-${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -f build/docker/Dockerfile \
            -t "${{ steps.meta.outputs.primary_image }}" \
            .

      # profile:database-postgres:start
      - name: Validate migrations and runtime image
        run: |
          make migration-validate \
            RUNTIME_IMAGE="${{ steps.meta.outputs.primary_image }}" \
            RUNTIME_EXPECTED_VERSION="${{ steps.meta.outputs.version }}"
      # profile:database-postgres:end

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Push release candidate image
        run: |
          docker push "${{ steps.meta.outputs.primary_image }}"

      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST="$(docker image inspect "${{ steps.meta.outputs.primary_image }}" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign container image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify release trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@${GITHUB_REF}"

          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"
          gh attestation verify "oci://${IMAGE}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type "https://cyclonedx.org/bom"

      - name: Promote verified release tags
        run: |
          for tag in \
            "${{ steps.meta.outputs.tag_version }}" \
            "${{ steps.meta.outputs.tag_latest }}"; do
            docker tag \
              "${{ steps.meta.outputs.primary_image }}" \
              "${{ steps.meta.outputs.image_repo }}:${tag}"
            docker push "${{ steps.meta.outputs.image_repo }}:${tag}"
            test "$(
              docker buildx imagetools inspect \
                --format '{{.Manifest.Digest}}' \
                "${{ steps.meta.outputs.image_repo }}:${tag}"
            )" = "${{ steps.digest.outputs.digest }}"
          done

      - name: Publish immutable image reference
        run: |
          {
            echo "### Published image"
            echo
            printf '`%s`\n' "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: sbom.cdx.json
          if-no-files-found: error

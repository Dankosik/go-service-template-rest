name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Scanner and signing versions are not here. Both publications run
# .github/actions/publish-image, which pins them as input defaults so the version
# that scans an image is the version that signs it, in one place.
env:
  GOFLAGS: -mod=readonly

jobs:
  publish-main:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: migration-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # The commit CI proved, not the branch tip: the two can differ by the time
      # this runs, and the `if` above is what makes them the same commit here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/publish-image
        with:
          mode: main
          candidate_sha: ${{ github.event.workflow_run.head_sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          migration_bootstrap_sha: ${{ vars.MIGRATION_HISTORY_BOOTSTRAP_SHA }}

  release-preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require successful push CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${GITHUB_SHA}&status=completed&per_page=100"
          )"
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.[] | .workflow_runs[]?;
              .head_sha == $sha and .event == "push" and .conclusion == "success")' \
            <<<"${runs}" >/dev/null

      - name: Setup Go
        uses: ./.github/actions/setup-go

      - name: Setup golangci-lint
        uses: ./.github/actions/setup-golangci-lint

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify module integrity
        run: make mod-check

      - name: Verify template initialization contract
        run: make template-init-check GOLANGCI_LINT_BIN=golangci-lint

      - name: Verify formatting drift
        run: make fmt-check

      # profile:database-postgres:start
      - name: Verify sqlc generation drift
        run: make sqlc-check
      # profile:database-postgres:end

      - name: Verify project structure
        run: make project-structure-check

      - name: Lint
        run: make lint GOLANGCI_LINT=golangci-lint

      - name: Coverage + JUnit + JSON
        run: make test-report

      - name: Race detector
        run: make test-race

      - name: Integration tests
        run: REQUIRE_DOCKER=1 make test-integration

      - name: OpenAPI contract checks
        run: make openapi-check

      - name: Run Go security checks
        run: make go-security

      - name: Secret scan
        run: make secret-scan-history

  publish-release:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release-preflight
    timeout-minutes: 45
    concurrency:
      group: migration-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/publish-image
        with:
          mode: release
          candidate_sha: ${{ github.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          migration_bootstrap_sha: ${{ vars.MIGRATION_HISTORY_BOOTSTRAP_SHA }}

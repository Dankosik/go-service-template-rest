name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: [v*]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' && (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch &&
          github.event.workflow_run.head_sha == github.sha
        ) || (
          github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: migration-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Require exact-SHA CI for release tag
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${GITHUB_SHA}&status=completed&per_page=100" |
            jq -e --arg sha "${GITHUB_SHA}" \
              'any(.[] | .workflow_runs[]?; .head_sha == $sha and .conclusion == "success")'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: ./.github/actions/publish-image
        with:
          mode: ${{ github.event_name == 'workflow_run' && 'main' || 'release' }}
          candidate_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          migration_bootstrap_sha: ${{ vars.MIGRATION_HISTORY_BOOTSTRAP_SHA }}

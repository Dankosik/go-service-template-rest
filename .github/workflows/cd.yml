name: cd

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  COVERAGE_MIN: "80.0"
  COSIGN_VERSION: v2.6.2

jobs:
  publish-main:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: migration-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA:0:12}"

          {
            echo "image_repo=${IMAGE_REPO}"
            echo "tag_main=main"
            echo "tag_sha=sha-${SHORT_SHA}"
            echo "version=sha-${SHORT_SHA}"
            echo "primary_image=${IMAGE_REPO}:sha-${SHORT_SHA}"
            echo "artifact_name=sbom-main-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      # profile:database-postgres:start
      - name: Resolve migration publication mode
        id: migration_history
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          MIGRATION_HISTORY_BOOTSTRAP_SHA: ${{ vars.MIGRATION_HISTORY_BOOTSTRAP_SHA }}
        run: |
          mode="$(bash ./scripts/ci/migration-image-history-check.sh package-mode)"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      # profile:database-postgres:end

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # profile:database-postgres:start
      - name: Load trusted migration history image
        if: steps.migration_history.outputs.mode == 'history'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="${{ steps.meta.outputs.image_repo }}:migration-history"
          digest="$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${marker}"
          )"
          test -n "${digest}"
          image="${{ steps.meta.outputs.image_repo }}@${digest}"
          escaped_repository="${GITHUB_REPOSITORY//./\\.}"
          identity="^https://github\\.com/${escaped_repository}/\\.github/workflows/cd\\.yml@refs/(heads/.+|tags/v.+)$"
          cosign verify \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image}"
          gh attestation verify "oci://${image}" --repo "${GITHUB_REPOSITORY}"
          docker pull "${image}"
          container="$(docker create "${image}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir -p .artifacts/migration-history
          docker cp "${container}:/migrations/." .artifacts/migration-history/
          docker rm -f "${container}" >/dev/null
          trap - EXIT
      # profile:database-postgres:end

      - name: Build image
        run: |
          APP_VERSION="${{ steps.meta.outputs.version }}" \
            VCS_REF="${GITHUB_SHA}" \
            SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            make runtime-image-build \
              RUNTIME_IMAGE="${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_sha }}"

      # profile:database-postgres:start
      - name: Verify candidate preserves published migrations
        if: steps.migration_history.outputs.mode == 'history'
        run: |
          container="$(docker create "${{ steps.meta.outputs.primary_image }}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir -p .artifacts/migration-candidate
          docker cp "${container}:/migrations/." .artifacts/migration-candidate/
          docker rm -f "${container}" >/dev/null
          trap - EXIT
          bash ./scripts/ci/migration-image-history-check.sh compare \
            .artifacts/migration-history \
            .artifacts/migration-candidate

      - name: Validate migrations and runtime image
        run: |
          make migration-validate \
            RUNTIME_IMAGE="${{ steps.meta.outputs.primary_image }}" \
            RUNTIME_EXPECTED_VERSION="${{ steps.meta.outputs.version }}"
      # profile:database-postgres:end

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Push immutable image tag
        run: |
          docker push "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_sha }}"

      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST="$(docker image inspect "${{ steps.meta.outputs.primary_image }}" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign container image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify release trust
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@refs/heads/${DEFAULT_BRANCH}"

          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"
          gh attestation verify "oci://${IMAGE}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type "https://cyclonedx.org/bom"

      # profile:database-postgres:start
      - name: Advance verified migration history marker
        run: |
          docker tag \
            "${{ steps.meta.outputs.primary_image }}" \
            "${{ steps.meta.outputs.image_repo }}:migration-history"
          docker push "${{ steps.meta.outputs.image_repo }}:migration-history"
          test "$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${{ steps.meta.outputs.image_repo }}:migration-history"
          )" = "${{ steps.digest.outputs.digest }}"
      # profile:database-postgres:end

      - name: Promote verified main tag
        run: |
          docker tag \
            "${{ steps.meta.outputs.primary_image }}" \
            "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_main }}"
          docker push "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_main }}"
          test "$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${{ steps.meta.outputs.image_repo }}:${{ steps.meta.outputs.tag_main }}"
          )" = "${{ steps.digest.outputs.digest }}"

      - name: Publish immutable image reference
        run: |
          {
            echo "### Published image"
            echo
            # Markdown backticks are intentionally literal.
            # shellcheck disable=SC2016
            printf '`%s`\n' "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: sbom.cdx.json
          if-no-files-found: error

  release-preflight:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require successful push CI for release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(
            gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?event=push&head_sha=${GITHUB_SHA}&status=completed&per_page=100"
          )"
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.[] | .workflow_runs[]?;
              .head_sha == $sha and .event == "push" and .conclusion == "success")' \
            <<<"${runs}" >/dev/null

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Resolve golangci-lint version
        id: golangci_lint
        run: |
          VERSION="$(awk '$1 == "github.com/golangci/golangci-lint/v2" { print $2 }' tools/go.mod)"
          test -n "${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.golangci_lint.outputs.version }}
          install-only: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"

      - name: Verify module integrity
        run: make mod-check

      - name: Verify template initialization contract
        run: make template-init-check GOLANGCI_LINT_BIN=golangci-lint

      - name: Verify formatting drift
        run: make fmt-check

      # profile:database-postgres:start
      - name: Verify sqlc generation drift
        run: make sqlc-check
      # profile:database-postgres:end

      - name: Verify project structure
        run: make project-structure-check

      - name: Lint
        run: make lint GOLANGCI_LINT=golangci-lint

      - name: Coverage + JUnit + JSON
        run: make test-report COVERAGE_MIN=${{ env.COVERAGE_MIN }}

      - name: Race detector
        run: make test-race

      - name: Integration tests
        run: REQUIRE_DOCKER=1 make test-integration

      - name: OpenAPI contract checks
        run: make openapi-check

      - name: Run Go security checks
        run: make go-security

      - name: Secret scan
        run: make secret-scan-history

  publish-release:
    if: >-
      vars.ENABLE_GHCR_PUBLISH == 'true' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: release-preflight
    timeout-minutes: 45
    concurrency:
      group: migration-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION_TAG="${GITHUB_REF_NAME}"

          {
            echo "image_repo=${IMAGE_REPO}"
            echo "tag_version=${VERSION_TAG}"
            echo "tag_latest=latest"
            echo "version=${VERSION_TAG}"
            echo "primary_image=${IMAGE_REPO}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "artifact_name=sbom-${VERSION_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin

      # profile:database-postgres:start
      - name: Resolve migration publication mode
        id: migration_history
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          GITHUB_REPOSITORY_OWNER_TYPE: ${{ github.event.repository.owner.type }}
          MIGRATION_HISTORY_BOOTSTRAP_SHA: ${{ vars.MIGRATION_HISTORY_BOOTSTRAP_SHA }}
        run: |
          mode="$(bash ./scripts/ci/migration-image-history-check.sh package-mode)"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      # profile:database-postgres:end

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # profile:database-postgres:start
      - name: Load trusted migration history image
        if: steps.migration_history.outputs.mode == 'history'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker="${{ steps.meta.outputs.image_repo }}:migration-history"
          digest="$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${marker}"
          )"
          test -n "${digest}"
          image="${{ steps.meta.outputs.image_repo }}@${digest}"
          escaped_repository="${GITHUB_REPOSITORY//./\\.}"
          identity="^https://github\\.com/${escaped_repository}/\\.github/workflows/cd\\.yml@refs/(heads/.+|tags/v.+)$"
          cosign verify \
            --certificate-identity-regexp "${identity}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${image}"
          gh attestation verify "oci://${image}" --repo "${GITHUB_REPOSITORY}"
          docker pull "${image}"
          container="$(docker create "${image}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir -p .artifacts/migration-history
          docker cp "${container}:/migrations/." .artifacts/migration-history/
          docker rm -f "${container}" >/dev/null
          trap - EXIT
      # profile:database-postgres:end

      - name: Build image
        run: |
          APP_VERSION="${{ steps.meta.outputs.version }}" \
            VCS_REF="${GITHUB_SHA}" \
            SOURCE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            make runtime-image-build RUNTIME_IMAGE="${{ steps.meta.outputs.primary_image }}"

      # profile:database-postgres:start
      - name: Verify candidate preserves published migrations
        if: steps.migration_history.outputs.mode == 'history'
        run: |
          container="$(docker create "${{ steps.meta.outputs.primary_image }}")"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir -p .artifacts/migration-candidate
          docker cp "${container}:/migrations/." .artifacts/migration-candidate/
          docker rm -f "${container}" >/dev/null
          trap - EXIT
          bash ./scripts/ci/migration-image-history-check.sh compare \
            .artifacts/migration-history \
            .artifacts/migration-candidate

      - name: Validate migrations and runtime image
        run: |
          make migration-validate \
            RUNTIME_IMAGE="${{ steps.meta.outputs.primary_image }}" \
            RUNTIME_EXPECTED_VERSION="${{ steps.meta.outputs.version }}"
      # profile:database-postgres:end

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # 0.34.2
        with:
          image-ref: ${{ steps.meta.outputs.primary_image }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Push release candidate image
        run: |
          docker push "${{ steps.meta.outputs.primary_image }}"

      - name: Resolve pushed digest
        id: digest
        run: |
          DIGEST="$(docker image inspect "${{ steps.meta.outputs.primary_image }}" --format '{{index .RepoDigests 0}}' | cut -d'@' -f2)"
          test -n "${DIGEST}"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign container image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ steps.meta.outputs.image_repo }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Verify release trust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/cd.yml@${GITHUB_REF}"

          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}"
          gh attestation verify "oci://${IMAGE}" --repo "${GITHUB_REPOSITORY}"
          gh attestation verify "oci://${IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --predicate-type "https://cyclonedx.org/bom"

      # profile:database-postgres:start
      - name: Advance verified migration history marker
        run: |
          docker tag \
            "${{ steps.meta.outputs.primary_image }}" \
            "${{ steps.meta.outputs.image_repo }}:migration-history"
          docker push "${{ steps.meta.outputs.image_repo }}:migration-history"
          test "$(
            docker buildx imagetools inspect \
              --format '{{.Manifest.Digest}}' \
              "${{ steps.meta.outputs.image_repo }}:migration-history"
          )" = "${{ steps.digest.outputs.digest }}"
      # profile:database-postgres:end

      - name: Promote verified release tags
        run: |
          for tag in \
            "${{ steps.meta.outputs.tag_version }}" \
            "${{ steps.meta.outputs.tag_latest }}"; do
            docker tag \
              "${{ steps.meta.outputs.primary_image }}" \
              "${{ steps.meta.outputs.image_repo }}:${tag}"
            docker push "${{ steps.meta.outputs.image_repo }}:${tag}"
            test "$(
              docker buildx imagetools inspect \
                --format '{{.Manifest.Digest}}' \
                "${{ steps.meta.outputs.image_repo }}:${tag}"
            )" = "${{ steps.digest.outputs.digest }}"
          done

      - name: Publish immutable image reference
        run: |
          {
            echo "### Published image"
            echo
            # Markdown backticks are intentionally literal.
            # shellcheck disable=SC2016
            printf '`%s`\n' "${{ steps.meta.outputs.image_repo }}@${{ steps.digest.outputs.digest }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: sbom.cdx.json
          if-no-files-found: error

name: Bug report
description: Report a reproducible problem in the template.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the template. Do not report vulnerabilities here; use `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest commands or repository state that reproduce the problem.
      placeholder: |
        1. Create a repository from the template
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Template revision
      description: Commit SHA, tag, or date of the template version.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, operating system, Docker version, and relevant tooling.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Paste sanitized output. Remove secrets and private data.
      render: shell

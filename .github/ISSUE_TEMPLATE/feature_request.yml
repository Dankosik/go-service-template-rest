name: Feature request
description: Propose a concrete improvement to the template.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable success without prescribing unnecessary implementation.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
      description: How is the problem handled today?
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and trade-offs
      description: Note compatibility, security, data, lifecycle, or delivery constraints.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I checked that this is not already covered by the current template or documentation.
          required: true

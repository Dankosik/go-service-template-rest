title = "go-service-template-rest gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
description = "HTTP Idempotency-Key documentation examples in skill references"
condition = "AND"
regexTarget = "line"
regexes = ['''Idempotency-Key:\s*"?[A-Za-z0-9_-]+''']
paths = ['''^\.agents/skills/(go-api-contract-spec|api-contract-designer[-]spec)/references/(async-operations-and-webhooks|idempotency-preconditions-retries)\.md$''']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Cache key/value design prose in the DB/cache specification"
condition = "AND"
regexTarget = "line"
regexes = ['''key and value shape, freshness/TTL/invalidation/stampede behavior''']
paths = ['''^\.agents/skills/go-db-cache-spec/SKILL\.md$''']

version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - govet
    - staticcheck
    - errcheck
    - errname
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - embeddedstructfieldcheck
    - errchkjson
    - sqlclosecheck
    - errorlint
    - exhaustive
    - exhaustruct
    - fatcontext
    - forbidigo
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - gochecksumtype
    - goconst
    - contextcheck
    - cyclop
    - gocritic
    - gocognit
    - iface
    - inamedparam
    - interfacebloat
    - intrange
    - ireturn
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - promlinter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - tagliatelle
    - thelper
    - tparallel
    - gomoddirectives
    - unconvert
    - unqueryvet
    - unparam
    - usetesting
    - usestdlibvars
    - wastedassign
    - wrapcheck
  exclusions:
    generated: strict
    paths:
      - internal/openapi/openapi\.gen\.go
      - internal/infra/postgres/sqlcgen/.*
    rules:
      # Complexity gates are production-focused for now; table-heavy tests stay review-visible
      # without forcing artificial helper extraction.
      - path: _test\.go
        linters:
          - cyclop
          - forbidigo
          - exhaustruct
          - gocognit
          - nestif
      # recordStartupRejection's errorType varies by database profile: the
      # PostgreSQL startup stage records "dependency_init", and DATABASE=none has
      # no dependency stage, so a generated service passes one value. A nolint
      # directive cannot express that — it would itself be unused in the profile
      # where the parameter does vary.
      - path: cmd/service/internal/bootstrap/startup_rejections\.go
        linters:
          - unparam
  settings:
    staticcheck:
      checks:
        - all
        - "-ST1000"
    sloglint:
      # Correlation is published by internal/observability/logctx from the context
      # a record is logged with, so a call that drops the context it already holds
      # silently drops request_id, trace_id, and span_id. "scope" enforces the
      # context-accepting method exactly where a context exists, rather than
      # forcing context.Background() into records that genuinely have none.
      context: scope
    iface:
      enable:
        - identical
        - unused
        - opaque
        - unexported
    goconst:
      ignore-tests: true
      min-occurrences: 4
    govet:
      enable:
        - deepequalerrors
        - reflectvaluecompare
        - sortslice
        - unusedwrite
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - '^.*/internal/openapi\..*ResponseObject$'
        - '^go\.opentelemetry\.io/otel/metric\.MeterProvider$'
        - '^go\.opentelemetry\.io/otel/sdk/metric\.Reader$'
        - '^go\.opentelemetry\.io/otel/sdk/trace\.Sampler$'
    depguard:
      rules:
        feature_packages_no_adapters:
          list-mode: lax
          files:
            - "**/internal/**/*.go"
            - "!**/cmd/**/*.go"
            - "!**/internal/config/**/*.go"
            - "!**/internal/infra/**/*.go"
            - "!**/internal/observability/**/*.go"
            - "!**/internal/openapi/**/*.go"
          deny:
            - pkg: github.com/example/go-service-template-rest/internal/openapi
              desc: feature packages must stay transport-contract agnostic; map generated OpenAPI types in internal/infra/http.
            - pkg: github.com/example/go-service-template-rest/internal/infra
              desc: feature packages must not import concrete infra adapters; wire adapters in bootstrap.
            - pkg: github.com/example/go-service-template-rest/internal/config
              desc: runtime configuration belongs to bootstrap and adapters, not feature behavior.
            - pkg: github.com/example/go-service-template-rest/cmd
              desc: feature packages must not import composition roots.
            - pkg: github.com/jackc/pgx/v5
              desc: direct Postgres driver usage belongs in internal/infra/postgres.
        config_no_runtime_owners:
          list-mode: lax
          files:
            - "**/internal/config/**/*.go"
          allow:
            - github.com/example/go-service-template-rest/internal/observability/otelconfig
          deny:
            - pkg: github.com/example/go-service-template-rest/internal
              desc: config parsing must not depend on features, runtime adapters, or transport contracts.
            - pkg: github.com/example/go-service-template-rest/cmd
              desc: config parsing must not depend on composition roots.
        health_no_runtime_adapters:
          list-mode: lax
          files:
            - "**/internal/health/**/*.go"
          deny:
            - pkg: github.com/example/go-service-template-rest/internal
              desc: health behavior receives probes and must not depend on config, adapters, generated contracts, or other features.
            - pkg: github.com/example/go-service-template-rest/cmd
              desc: health behavior must not depend on composition roots.
        http_no_postgres:
          list-mode: lax
          files:
            - "**/internal/infra/http/**/*.go"
          deny:
            - pkg: github.com/example/go-service-template-rest/internal/infra/postgres
              desc: HTTP maps feature behavior and must not call the database adapter directly.
        otelconfig_is_pure_policy:
          list-mode: lax
          files:
            - "**/internal/observability/otelconfig/**/*.go"
          deny:
            - pkg: github.com/example/go-service-template-rest/internal
              desc: otelconfig is pure OpenTelemetry policy and must not depend on repository runtime packages.
            - pkg: go.opentelemetry.io/otel/sdk
              desc: SDK construction belongs in internal/infra/telemetry.
        postgres_driver_boundary:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/infra/postgres/*.go"
            # profile:outbox-postgres:start
            # The optional outbox store is itself a PostgreSQL runtime adapter;
            # its directory is removed when OUTBOX=none.
            - "!**/internal/infra/postgresoutbox/store*.go"
            # profile:outbox-postgres:end
            # pgtest is a PostgreSQL adapter like the two above, scoped to tests:
            # it creates and drops the per-test database, which is driver work.
            - "!**/internal/infra/postgres/pgtest/*.go"
            - "!**/internal/infra/postgresmigrate/*.go"
          deny:
            - pkg: database/sql
              desc: database driver access belongs in PostgreSQL runtime or migration adapters.
            - pkg: github.com/jackc/pgx/v5
              desc: direct pgx usage belongs in PostgreSQL runtime or migration adapters.
            - pkg: github.com/lib/pq
              desc: use the approved pgx-based Postgres adapter in internal/infra/postgres.
            - pkg: gorm.io/gorm
              desc: persistence ORM usage is not part of the approved repository data-access model.
        sqlc_boundary:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/infra/postgres/*.go"
            # profile:outbox-postgres:start
            - "!**/internal/infra/postgresoutbox/store*.go"
            # profile:outbox-postgres:end
          deny:
            - pkg: github.com/example/go-service-template-rest/internal/infra/postgres/sqlcgen
              desc: generated sqlc types stay behind the hand-written internal/infra/postgres adapter.
        approved_router_boundary:
          list-mode: lax
          files:
            - "$all"
            - "!**/internal/openapi/*.go"
            - "!**/internal/infra/http/*.go"
          deny:
            - pkg: github.com/go-chi/chi/v5
              desc: chi router usage belongs in internal/infra/http and generated OpenAPI bindings only.
        alternate_router_policy:
          list-mode: lax
          files:
            - "$all"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: use the approved chi and OpenAPI HTTP stack in internal/infra/http.
            - pkg: github.com/gofiber/fiber
              desc: use the approved net/http-compatible chi and OpenAPI HTTP stack.
            - pkg: github.com/gorilla/mux
              desc: use the approved chi and OpenAPI HTTP stack in internal/infra/http.
            - pkg: github.com/julienschmidt/httprouter
              desc: use the approved chi and OpenAPI HTTP stack in internal/infra/http.
            - pkg: github.com/labstack/echo
              desc: use the approved chi and OpenAPI HTTP stack in internal/infra/http.
        alternate_logging_policy:
          list-mode: lax
          files:
            - "$all"
          deny:
            - pkg: github.com/rs/zerolog
              desc: use the standard log/slog logging surface configured by bootstrap.
            - pkg: github.com/sirupsen/logrus
              desc: use the standard log/slog logging surface configured by bootstrap.
            - pkg: go.uber.org/zap
              desc: use the standard log/slog logging surface configured by bootstrap.
    cyclop:
      max-complexity: 20
    exhaustruct:
      allow-empty-returns: true
      include:
        - '^github\.com/example/go-service-template-rest/internal/openapi\.Problem$'
        - '^github\.com/example/go-service-template-rest/internal/config\.(Config|AppConfig|HTTPConfig|LogConfig|ObservabilityConfig|OTelConfig|OTelExporterConfig|PostgresConfig)$'
        # profile:grpc:start
        - '^github\.com/example/go-service-template-rest/internal/config\.(GRPCConfig|GRPCServerConfig|GRPCTLSConfig)$'
        # profile:grpc:end
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^(fmt\.Print(f|ln)?|print|println)$'
          msg: use structured logging or test assertions instead of process stdout debug output.
        - pattern: '^log\.(Fatal(f|ln)?|Panic(f|ln)?|Print(f|ln)?)$'
          msg: use log/slog through the configured logging surface, or return an error to the caller.
    gocognit:
      min-complexity: 30
    nestif:
      min-complexity: 5
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: context-as-argument
        - name: unused-parameter
    tagliatelle:
      case:
        rules:
          json: snake
          koanf: snake
          yaml: snake

version: v2
plugins:
  - local:
      - bash
      - ../../scripts/run-go-tool.sh
      - protoc-gen-go
    out: internal/gen/proto
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - local:
      - bash
      - ../../scripts/run-go-tool.sh
      - protoc-gen-go-grpc
    out: internal/gen/proto
    opt:
      - paths=source_relative

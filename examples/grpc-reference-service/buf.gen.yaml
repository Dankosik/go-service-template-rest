version: v2
plugins:
  - local:
      - go
      - tool
      - -modfile=../../tools/go.mod
      - protoc-gen-go
    out: internal/gen/proto
    opt:
      - paths=source_relative
      - default_api_level=API_OPAQUE
  - local:
      - go
      - tool
      - -modfile=../../tools/go.mod
      - protoc-gen-go-grpc
    out: internal/gen/proto
    opt:
      - paths=source_relative

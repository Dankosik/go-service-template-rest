# template-owned-codex-runtime:start
developer_instructions = """
During an event-driven wait on sub-agents, use a multi-minute wait. The active
wait is not a silent gap requiring commentary. This is an explicit exception
to general 60-second commentary and blocking-wait guidance. Unless the user
requests periodic updates, report only dispatch, a material state change,
blocker, user decision, or completion; do not emit unchanged heartbeats or poll
a healthy agent for status.
"""

[agents]
max_concurrent_threads_per_session = 20
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"
# template-owned-codex-runtime:end

# template-owned-codex-agents:start
# Registry compatibility: agents.<name>.config_file entries are required by Codex.
[agents.adjudicator-agent]
config_file = "agents/adjudicator-agent.toml"

[agents.evidence-agent]
config_file = "agents/evidence-agent.toml"

[agents.reviewer-agent]
config_file = "agents/reviewer-agent.toml"

[agents.specialist-agent]
config_file = "agents/specialist-agent.toml"

[agents.worker-agent]
config_file = "agents/worker-agent.toml"

# template-owned-codex-agents:end

[agents]
max_depth = 1

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ANTHROPIC_BASE_URL = "https://api.gonkagate.com"

# template-owned-codex-agents:start
# Registry compatibility: agents.<name>.config_file entries are required by Codex.
[agents.adjudicator-agent]
config_file = "agents/adjudicator-agent.toml"

[agents.evidence-agent]
config_file = "agents/evidence-agent.toml"

[agents.reviewer-agent]
config_file = "agents/reviewer-agent.toml"

[agents.specialist-agent]
config_file = "agents/specialist-agent.toml"

[agents.worker-agent]
config_file = "agents/worker-agent.toml"

# template-owned-codex-agents:end

# Railway deployment-policy source of truth for this service template.
# Owners: Platform + Service Owner.
# Scope: non-secret deployment policy only. Keep secrets in Railway variables.
# Review rule: policy changes require PR review and the affected CI/release gates.

[build]
builder = "DOCKERFILE"
dockerfilePath = "build/docker/Dockerfile"
watchPatterns = [
  "/.dockerignore",
  "/api/**",
  "/build/docker/**",
  "/cmd/**",
  "/internal/**",
  "/migrations/**",
  "/go.mod",
  "/go.sum",
  "/railway.toml",
]

[deploy]
# profile:database-postgres:start
preDeployCommand = ["/migrate"]
# profile:database-postgres:end
healthcheckPath = "/health/ready"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
overlapSeconds = 45
drainingSeconds = 45

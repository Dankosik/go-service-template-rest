syntax = "proto3";

package billing.events.v1;

option go_package = "github.com/Dankosik/billing-service/internal/api/events/v1;eventsv1";

message MicroleaseEventEnvelope {
  string event_id = 1;
  string event_type = 2;
  string contract_version = 3;
  string schema_version = 4;
  string producer_identity = 5;
  string event_fingerprint = 6;
  int64 occurred_at_epoch_ms = 7;
  int64 produced_at_epoch_ms = 8;
  string trace_correlation_id = 9;
}

message PricingSnapshotBasis {
  string pricing_snapshot_id = 1;
  string snapshot_fingerprint = 2;
  string policy_version = 3;
  string selector_key = 4;
  string use_class = 5;
  string contract_version = 6;
}

message MicroleaseIdentity {
  string microlease_id = 1;
  string account_scope_key = 2;
  string proxy_allocator_owner_id = 3;
  int64 microlease_generation = 4;
}

message MicroleaseChildTerminalSubmitted {
  MicroleaseEventEnvelope envelope = 1;
  MicroleaseIdentity identity = 2;
  string debit_authorization_id = 3;
  int64 child_sequence = 4;
  int64 child_cap_usd_atoms = 5;
  string terminal_kind = 6;
  int64 charged_usd_atoms = 7;
  int64 released_usd_atoms = 8;
  int64 write_off_usd_atoms = 9;
  string request_basis_fingerprint = 10;
  string terminal_basis_fingerprint = 11;
  PricingSnapshotBasis pricing = 12;
  string qualified_inference_evidence_id = 13;
  string safe_execution_reference = 14;
  int64 terminal_deadline_epoch_ms = 15;
  int64 observed_terminal_epoch_ms = 16;
}

message MicroleaseCheckpointReported {
  MicroleaseEventEnvelope envelope = 1;
  MicroleaseIdentity identity = 2;
  int64 checkpoint_sequence = 3;
  string checkpoint_kind = 4;
  int64 allocated_child_high_water = 5;
  int64 allocated_child_count = 6;
  int64 allocated_child_cap_sum_usd_atoms = 7;
  int64 terminal_submitted_count = 8;
  int64 terminal_published_count = 9;
  int64 terminal_accepted_count = 10;
  int64 unresolved_child_count = 11;
  int64 unresolved_child_cap_sum_usd_atoms = 12;
  int64 local_remaining_usd_atoms = 13;
  string checkpoint_fingerprint = 14;
}

message MicroleaseCloseReported {
  MicroleaseCheckpointReported checkpoint = 1;
  string close_reason = 2;
  int64 allocator_closed_epoch_ms = 3;
  string final_local_state_fingerprint = 4;
}

message MicroleaseIssued {
  MicroleaseEventEnvelope envelope = 1;
  MicroleaseIdentity identity = 2;
  int64 issued_cap_usd_atoms = 3;
  int64 debit_cutoff_epoch_ms = 4;
  int64 expires_at_epoch_ms = 5;
  string result_class = 6;
  PricingSnapshotBasis pricing = 7;
  string microlease_policy_version = 8;
}

message MicroleaseTerminalApplied {
  MicroleaseEventEnvelope envelope = 1;
  MicroleaseIdentity identity = 2;
  string debit_authorization_id = 3;
  string terminal_kind = 4;
  int64 charged_usd_atoms = 5;
  int64 released_usd_atoms = 6;
  int64 write_off_usd_atoms = 7;
  string result_class = 8;
  string ledger_entry_id = 9;
  string settlement_effect_id = 10;
  string reconciliation_case_id = 11;
}

message MicroleaseClosed {
  MicroleaseEventEnvelope envelope = 1;
  MicroleaseIdentity identity = 2;
  string close_state = 3;
  int64 released_usd_atoms = 4;
  int64 unresolved_reserved_usd_atoms = 5;
  string reconciliation_case_id = 6;
}

message MicroleaseAdmissionRejected {
  MicroleaseEventEnvelope envelope = 1;
  string reason_class = 2;
  string strict_class = 3;
  string use_class = 4;
  string lag_bucket = 5;
  string stale_bucket = 6;
  string backlog_bucket = 7;
}

openapi: 3.0.3
info:
  title: go-service-template-rest
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.your-service.tld
    description: placeholder production base URL
security: []
tags:
  - name: system
    description: Operational endpoints for liveness and readiness.
  - name: app
    description: Application endpoints.
paths:
  /api/v1/ping:
    get:
      tags: [app]
      summary: Ping endpoint
      operationId: ping
      x-security-decision:
        exposure: public
        rationale: sample endpoint for template smoke checks
      responses:
        "200":
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v1/template-example/{slug}:
    post:
      tags: [app]
      summary: Exercise generated request validation
      description: |
        TEMPLATE EXAMPLE: this operation is intentionally synthetic. Delete it
        if the service does not need it, or replace it with real business logic
        and remove the marker.
      operationId: templateExample
      x-template-example: true
      x-security-decision:
        exposure: public
        rationale: synthetic validation example; no placeholder authentication is permitted
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
            pattern: "^[a-z][a-z0-9-]*$"
        - name: copies
          in: query
          required: true
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplateExampleRequest"
      responses:
        "200":
          description: validated request values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateExampleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health/live:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: healthLive
      x-security-decision:
        exposure: public
        rationale: process-only platform liveness endpoint with no dependency details
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health/ready:
    get:
      tags: [system]
      summary: Readiness probe
      operationId: healthReady
      x-security-decision:
        exposure: public
        rationale: platform readiness endpoint exposing only generic ready state
      responses:
        "200":
          description: ready
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: not ready
          content:
            text/plain:
              schema:
                type: string
                example: not ready
components:
  schemas:
    TemplateExampleRequest:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 64
    TemplateExampleResponse:
      type: object
      additionalProperties: false
      required:
        - slug
        - messages
      properties:
        slug:
          type: string
        messages:
          type: array
          items:
            type: string
    Problem:
      type: object
      required:
        - code
        - type
        - title
        - status
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: bad_request
        type:
          type: string
          format: uri-reference
          description: Stable URI reference identifying the problem class.
          example: https://www.rfc-editor.org/rfc/rfc9110#section-15.5.1
        title:
          type: string
          example: bad request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: invalid request framing
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence when the service exposes one.
        request_id:
          type: string
          example: 9ccecdfd92c94665a46406f8ba73cd77
  responses:
    BadRequest:
      description: request is malformed or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestEntityTooLarge:
      description: request body exceeds configured limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: unexpected server failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

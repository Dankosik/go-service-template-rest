openapi: 3.0.3
info:
  title: billing-service
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://billing-service.internal.gonkagate.local
    description: placeholder internal service base URL
security: []
tags:
  - name: system
    description: Operational endpoints for liveness, readiness, and metrics.
  - name: billing
    description: Billing endpoints.
paths:
  /api/v1/ping:
    get:
      tags: [billing]
      summary: Billing service ping endpoint
      operationId: ping
      x-security-decision:
        exposure: public
        rationale: bootstrap endpoint for service smoke checks
      responses:
        "200":
          description: pong
          content:
            text/plain:
              schema:
                type: string
                example: pong
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health/live:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: healthLive
      x-security-decision:
        exposure: public
        rationale: process-only platform liveness endpoint with no dependency details
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health/ready:
    get:
      tags: [system]
      summary: Readiness probe
      operationId: healthReady
      x-security-decision:
        exposure: public
        rationale: platform readiness endpoint exposing only generic ready state
      responses:
        "200":
          description: ready
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: not ready
          content:
            text/plain:
              schema:
                type: string
                example: not ready
  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics
      operationId: metrics
      x-security-decision:
        exposure: operational-private-required
        rationale: operational telemetry requires private scrape path, internal listener, or future real auth before internet exposure
      responses:
        "200":
          description: metrics output
          content:
            text/plain:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/accounts/resolve:
    post:
      tags: [billing]
      summary: Resolve represented caller identity to a billing account
      operationId: resolveBillingAccount
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.accounts.resolve]
      x-security-decision:
        exposure: protected
        rationale: service-to-service account binding and migration-readiness path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountResolveRequest"
      responses:
        "200":
          description: account resolve outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResolveResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/accounts/{accountScopeKey}/balance:
    get:
      tags: [billing]
      summary: Read authoritative billing balance and active exposure
      operationId: readBillingBalance
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.balances.read]
      x-security-decision:
        exposure: protected
        rationale: service-to-service migrated balance readback path
      parameters:
        - name: accountScopeKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: representedSubjectId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: traceRequestId
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: deadlineAtEpochMs
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: balance read outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceReadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/usage/reservations:
    post:
      tags: [billing]
      summary: Create or read back migrated usage reserve lineage
      operationId: reserveUsage
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.usage.write]
      x-security-decision:
        exposure: protected
        rationale: money-lineage write path for usage reserve under billing authority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageReserveRequest"
      responses:
        "200":
          description: usage reserve outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/usage/finalizations:
    post:
      tags: [billing]
      summary: Finalize a usage operation within microlease authority
      operationId: finalizeUsage
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.usage.write]
      x-security-decision:
        exposure: protected
        rationale: money-effect terminal write path for usage finalization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageTerminalRequest"
      responses:
        "200":
          description: usage finalization outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/usage/write-offs:
    post:
      tags: [billing]
      summary: Write off or release a usage operation explicitly
      operationId: writeOffUsage
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.usage.write]
      x-security-decision:
        exposure: protected
        rationale: explicit support-safe write-off path for unchargeable usage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageTerminalRequest"
      responses:
        "200":
          description: usage write-off outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/usage/reversals:
    post:
      tags: [billing]
      summary: Reverse a previously committed usage effect
      operationId: reverseUsage
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.usage.write]
      x-security-decision:
        exposure: protected
        rationale: explicit compensation path for committed usage effects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageReversalRequest"
      responses:
        "200":
          description: usage reversal outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageOperationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/usage/readback:
    post:
      tags: [billing]
      summary: Read usage operation state by durable usage identity
      operationId: readUsageOperation
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.usage.read]
      x-security-decision:
        exposure: protected
        rationale: account-bound usage readback path for ambiguous outcomes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageReadbackRequest"
      responses:
        "200":
          description: usage readback outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageOperationReadbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/microleases/issue:
    post:
      tags: [billing]
      summary: Issue or replenish a billing microlease
      operationId: issueMicrolease
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.microleases.write]
      x-security-decision:
        exposure: protected
        rationale: money-affecting service-to-service microlease issuance path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicroleaseIssueRequest"
      responses:
        "200":
          description: issue or replay outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroleaseIssueResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/microleases/readback:
    post:
      tags: [billing]
      summary: Read a microlease or stored operation outcome
      operationId: readMicrolease
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.microleases.read]
      x-security-decision:
        exposure: protected
        rationale: support-safe service-to-service microlease readback path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicroleaseReadbackRequest"
      responses:
        "200":
          description: readback outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroleaseReadbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/microleases/close:
    post:
      tags: [billing]
      summary: Close or checkpoint a microlease with allocator proof
      operationId: closeMicrolease
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.microleases.write]
      x-security-decision:
        exposure: protected
        rationale: money-affecting service-to-service close and release path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MicroleaseCloseRequest"
      responses:
        "200":
          description: close or checkpoint outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MicroleaseCloseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "423":
          $ref: "#/components/responses/Locked"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/operations/readback:
    post:
      tags: [billing]
      summary: Read a stored operation outcome
      operationId: readBillingOperation
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.operations.read]
      x-security-decision:
        exposure: protected
        rationale: support-safe service-to-service operation readback path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingOperationReadbackRequest"
      responses:
        "200":
          description: operation readback outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingOperationReadbackResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/reconciliation/cases:
    get:
      tags: [billing]
      summary: List support-safe reconciliation cases
      operationId: listReconciliationCases
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.reconciliation.read]
      x-security-decision:
        exposure: protected
        rationale: scoped support readback for reconciliation cases
      parameters:
        - name: accountScopeKey
          in: query
          required: false
          schema:
            type: string
            minLength: 1
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [open, leased, waiting_evidence, manual_review, resolved, canceled]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
      responses:
        "200":
          description: reconciliation cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationCasesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/admin/accounts/{accountScopeKey}/ledger:
    get:
      tags: [billing]
      summary: Read support-safe ledger history for an account
      operationId: readAdminLedger
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.admin.read]
      x-security-decision:
        exposure: protected
        rationale: scoped internal ledger readback without mutation authority
      parameters:
        - name: accountScopeKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: ledger readback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLedgerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /internal/billing/v1/admin/accounts/{accountScopeKey}/exposure:
    get:
      tags: [billing]
      summary: Read active exposure and worker gate state for an account
      operationId: readAdminExposure
      security:
        - ServiceBearerAuth: []
      x-route-scopes: [billing.admin.read]
      x-security-decision:
        exposure: protected
        rationale: scoped internal exposure readback without mutation authority
      parameters:
        - name: accountScopeKey
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: exposure readback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminExposureResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  securitySchemes:
    ServiceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform-issued service identity token for protected internal billing routes.
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
      additionalProperties: false
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: bad request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: invalid request framing
        request_id:
          type: string
          example: 9ccecdfd92c94665a46406f8ba73cd77
    ContractVersion:
      type: string
      enum: [v1]
    CallerContext:
      type: object
      required:
        - callerPrincipal
        - callerScopeKey
        - requestId
        - deadlineAtEpochMs
      additionalProperties: false
      properties:
        callerPrincipal:
          type: string
          enum:
            - svc:gonka-proxy
            - svc:billing-service
            - billing-service.operator
        callerScopeKey:
          type: string
          minLength: 1
        requestId:
          type: string
          minLength: 1
        deadlineAtEpochMs:
          type: integer
          format: int64
          minimum: 0
    RepresentedUserContext:
      type: object
      additionalProperties: false
      properties:
        subjectId:
          type: string
          minLength: 1
        tenantId:
          type: string
          minLength: 1
        accountId:
          type: string
          minLength: 1
    SafeOperationMetadata:
      type: object
      additionalProperties:
        type: string
        maxLength: 256
      description: Support-safe bounded key/value metadata. Sensitive payloads and raw request bodies are prohibited.
    PricingSnapshotEvidence:
      type: object
      required:
        - pricingSnapshotId
        - snapshotFingerprint
        - policyVersion
        - decisionAt
        - selectorKey
        - useClass
        - normalizedPrice
        - priceUnit
        - baseAsset
        - quoteAsset
        - contractVersion
      additionalProperties: false
      properties:
        pricingSnapshotId:
          type: string
          minLength: 1
        snapshotFingerprint:
          type: string
          minLength: 1
        policyVersion:
          type: string
          minLength: 1
        decisionAt:
          type: string
          format: date-time
        selectorKey:
          type: string
          minLength: 1
        useClass:
          type: string
          enum: [usage_reserve, commercial_lineage]
        normalizedPrice:
          type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,18})?$'
        priceUnit:
          type: string
          enum: [quote_per_base_unit]
        baseAsset:
          type: string
          minLength: 1
        quoteAsset:
          type: string
          enum: [USD, USDT]
        contractVersion:
          type: string
          minLength: 1
        freshnessClass:
          type: string
          enum: [fresh, cached, bounded_lkg]
        maxAcceptedStalenessMs:
          type: integer
          format: int64
          minimum: 0
    AccountState:
      type: string
      enum: [active, suspended, manual_review, closed, not_found, not_ready]
    ImportState:
      type: string
      enum: [accepted, missing, pending, mismatch, reconcile_required, not_ready]
    RuntimeGateState:
      type: string
      enum: [ready, disabled, not_ready, fail_closed, strict, throttle]
    AccountResolveResultCode:
      type: string
      enum:
        - resolved
        - not_found
        - import_required
        - suspended
        - manual_review
        - reconcile_required
        - dependency_not_ready
        - not_ready
    AccountResolveRequest:
      type: object
      required:
        - routeContractId
        - contractVersion
        - callerContext
        - representedUserContext
        - deadlineAtEpochMs
        - traceRequestId
      additionalProperties: false
      properties:
        routeContractId:
          type: string
          enum: [billing.accounts.resolve]
        contractVersion:
          $ref: "#/components/schemas/ContractVersion"
        callerContext:
          $ref: "#/components/schemas/CallerContext"
        representedUserContext:
          $ref: "#/components/schemas/RepresentedUserContext"
        deadlineAtEpochMs:
          type: integer
          format: int64
          minimum: 0
        traceRequestId:
          type: string
          minLength: 1
    AccountResolveResponse:
      type: object
      required:
        - resultCode
        - accountScopeKey
        - accountState
        - importState
        - migrationState
        - balanceReadEligible
        - retryable
      additionalProperties: false
      properties:
        resultCode:
          $ref: "#/components/schemas/AccountResolveResultCode"
        accountScopeKey:
          type: string
          minLength: 1
        billingAccountId:
          type: string
          minLength: 1
        accountState:
          $ref: "#/components/schemas/AccountState"
        importState:
          $ref: "#/components/schemas/ImportState"
        migrationState:
          type: string
          enum: [legacy, shadow, internal_cohort, migrated, rollback]
        balanceReadEligible:
          type: boolean
        retryable:
          type: boolean
        failureClass:
          type: string
          minLength: 1
        balanceVersion:
          type: integer
          format: int64
          minimum: 0
    BalanceReadResultCode:
      type: string
      enum: [found, not_found, import_required, reconcile_required, manual_review, not_ready]
    BalanceReadResponse:
      type: object
      required:
        - resultCode
        - accountScopeKey
        - settledUsdAtoms
        - reservedUsdAtoms
        - availableUsdAtoms
        - pendingUsdAtoms
        - activeUsageHoldUsdAtoms
        - activeMicroleaseUsdAtoms
        - balanceVersion

openapi: 3.0.3
info:
  title: "go-service-template-rest"
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: current service origin
security: []
tags:
  - name: system
    description: Operational endpoints for liveness and readiness.
paths:
  /health/live:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: healthLive
      x-security-decision:
        exposure: public
        rationale: process-only platform liveness endpoint with no dependency details
      responses:
        "200":
          description: ok
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /health/ready:
    get:
      tags: [system]
      summary: Readiness probe
      operationId: healthReady
      x-security-decision:
        exposure: public
        rationale: platform readiness endpoint exposing only generic ready state
      responses:
        "200":
          description: ready
          content:
            text/plain:
              schema:
                type: string
                example: ok
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          description: not ready
          content:
            text/plain:
              schema:
                type: string
                example: not ready
components:
  schemas:
    Problem:
      type: object
      required:
        - code
        - type
        - title
        - status
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          example: bad_request
        type:
          type: string
          format: uri-reference
          description: Stable URI reference identifying the problem class.
          example: https://www.rfc-editor.org/rfc/rfc9110#section-15.5.1
        title:
          type: string
          example: bad request
        status:
          type: integer
          format: int32
          example: 400
        detail:
          type: string
          example: invalid request framing
        instance:
          type: string
          format: uri-reference
          description: URI reference identifying this occurrence when the service exposes one.
        request_id:
          type: string
          example: 9ccecdfd92c94665a46406f8ba73cd77
  responses:
    BadRequest:
      description: request is malformed or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    # There are deliberately no Unauthorized, Forbidden, or ServiceUnavailable
    # response components here. No operation in this contract declares a security
    # requirement, and load shedding answers before a request reaches an
    # operation — so every one of them would be an unreferenced component
    # describing behavior no declared operation can produce.
    #
    # An operation that adds `security:` declares its own 401 and 403 alongside
    # the ones below; TestOpenAPIRuntimeContractOperationsDeclareSecurityDecisions
    # fails the build if it does not. The runtime already emits the matching
    # problem codes: see problemCodeUnauthorized and problemCodeServiceUnavailable
    # in internal/infra/http/problem.go.
    RequestEntityTooLarge:
      description: request body exceeds configured limit
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalServerError:
      description: unexpected server failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
